<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('lift-theme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFT  Messages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/lift-shop.css">
<link rel="stylesheet" href="../css/messages.css">
</head>
<body class="lift-shell">

<div id="lift-header"></div>

<div class="lift-page msg-page">
  <a href="profile.html" class="lift-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to profile
  </a>
  <h1 class="lift-page-title">Messages</h1>
  <div id="msgContent"></div>
</div>

<div id="lift-footer"></div>
<div class="lift-toast" id="lift-toast"></div>

<div class="call-modal" id="callModal">
  <div class="call-sheet">
    <button type="button" class="call-close" id="callClose" aria-label="Close">&times;</button>
    <div class="call-avatar" id="callAvatar"></div>
    <h3 class="call-name" id="callName"></h3>
    <div class="call-status" id="callStatus">Calling…</div>
    <div class="call-video-frame" id="callVideoFrame" style="display:none;">
      <div class="call-video-placeholder">Camera preview</div>
    </div>
    <div class="call-actions">
      <button type="button" class="call-action-btn mute" id="callMuteBtn" title="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/></svg>
      </button>
      <button type="button" class="call-action-btn end" id="callEndBtn" title="End call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1-1a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 17.72V20a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4 2h2.28a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11l-1.27 1.27"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="../js/lift-shop.js"></script>
<script>
  LIFT.mountHeader('products');
  LIFT.mountFooter();

  var host = document.getElementById('msgContent');
  var params = new URLSearchParams(location.search);
  var activeKey = params.get('to') || null;

  function fmtTime(ts){
    return new Date(ts).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  }
  function initialOf(name){ return (name || '?').trim().charAt(0).toUpperCase(); }

  function renderShell(){
    if(!LIFT.user.get()){
      host.innerHTML =
        '<div class="lift-empty">' +
          '<div class="lift-empty-icon">' + LIFT.icon('lock') + '</div>' +
          '<h3>Log in to view messages</h3>' +
          '<p>Sign in to message the shoppers you follow.</p>' +
          '<a href="' + LIFT.loginUrl('#login') + '" class="lift-btn lift-btn-primary">Log In</a>' +
        '</div>';
      return false;
    }
    host.innerHTML =
      '<div class="msg-wrap">' +
        '<div class="thread-list" id="threadList"></div>' +
        '<div class="convo" id="convoPane"></div>' +
      '</div>';
    return true;
  }

  function renderThreadList(){
    var listEl = document.getElementById('threadList');
    var threads = LIFT.messages.inboxThreads();

    // make sure a thread exists for a ?to= deep link even before any message is sent
    if(activeKey && !threads.some(function(t){ return t.key === activeKey; })){
      threads.unshift({ key: activeKey, name: LIFT.social.displayNameFor(activeKey), lastText: 'Say hello', lastAt: Date.now(), unread: 0, isNew: true });
    }

    if(!threads.length){
      listEl.innerHTML =
        '<div class="thread-list-head">Conversations</div>' +
        '<div style="padding:20px 18px;color:var(--lh-text-soft);font-size:.85rem;">No conversations yet. Visit <a href="people.html" style="color:var(--lh-gold-deep);font-weight:700;">Find People</a> to start one.</div>';
      return;
    }

    listEl.innerHTML =
      '<div class="thread-list-head">Conversations</div>' +
      threads.map(function(t){
        return (
          '<div class="thread-row' + (t.key === activeKey ? ' active' : '') + '" data-key="' + t.key + '">' +
            '<div class="thread-avatar">' + initialOf(t.name) + '</div>' +
            '<div class="thread-meta">' +
              '<div class="t-name">' + LIFT.escapeHTML(t.name) + (t.unread ? '<span class="unread-dot"></span>' : '') + '</div>' +
              '<div class="t-last">' + LIFT.escapeHTML(t.lastText) + '</div>' +
            '</div>' +
          '</div>'
        );
      }).join('');
  }

  function renderConvo(){
    var pane = document.getElementById('convoPane');
    if(!activeKey){
      pane.innerHTML =
        '<div class="convo-empty">' +
          '<div style="font-size:2rem;">' + LIFT.icon('message-circle') + '</div>' +
          '<div>Select a conversation, or <a href="people.html" style="color:var(--lh-gold-deep);font-weight:700;text-decoration:none;">find someone new to message</a>.</div>' +
        '</div>';
      return;
    }

    LIFT.messages.markRead(activeKey);
    var name = LIFT.social.displayNameFor(activeKey);
    var person = LIFT.social.getUser(activeKey);
    var history = LIFT.messages.conversationWith(activeKey);
    var meKey = LIFT.user.key(LIFT.user.get());

    pane.innerHTML =
      '<div class="convo-head">' +
        '<a href="profile.html?user=' + encodeURIComponent(activeKey) + '" class="convo-head-id">' +
          '<div class="thread-avatar">' + initialOf(name) + '</div><h3>' + LIFT.escapeHTML(name) + '</h3>' +
        '</a>' +
        '<div class="convo-head-actions">' +
          '<button type="button" class="convo-call-btn" id="voiceCallBtn" title="Voice call" aria-label="Voice call">' + LIFT.icon('phone') + '</button>' +
          '<button type="button" class="convo-call-btn" id="videoCallBtn" title="Video call" aria-label="Video call">' + LIFT.icon('video') + '</button>' +
        '</div>' +
      '</div>' +
      '<div class="convo-body" id="convoBody">' +
        (history.length ? history.map(function(m){
          var mine = m.from === meKey;
          return (
            '<div class="bubble-row ' + (mine ? 'mine' : 'theirs') + '">' +
              '<div class="bubble">' + LIFT.escapeHTML(m.text) + (m.edited ? ' <em class="edited-tag">(edited)</em>' : '') + '<time>' + fmtTime(m.at) + '</time></div>' +
              (mine ?
                '<div class="bubble-menu-wrap">' +
                  '<button type="button" class="bubble-menu-btn" data-id="' + m.id + '" aria-label="Message options">' + LIFT.icon('more-vertical') + '</button>' +
                  '<div class="bubble-menu" data-id="' + m.id + '">' +
                    '<button type="button" class="bubble-menu-item bubble-edit-btn" data-id="' + m.id + '">' + LIFT.icon('pencil') + 'Edit</button>' +
                    '<button type="button" class="bubble-menu-item danger bubble-del-btn" data-id="' + m.id + '">' + LIFT.icon('trash-2') + 'Delete</button>' +
                  '</div>' +
                '</div>'
              : '') +
            '</div>'
          );
        }).join('') : '<div style="color:var(--lh-text-soft);font-size:.85rem;text-align:center;margin-top:20px;">No messages yet — say hello ' + LIFT.icon('hand') + '</div>') +
      '</div>' +
      '<form class="convo-form" id="convoForm">' +
        '<input type="text" id="convoInput" placeholder="Type a message…" autocomplete="off">' +
        '<button type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>' +
      '</form>';

    var body = document.getElementById('convoBody');
    body.scrollTop = body.scrollHeight;

    document.getElementById('convoForm').addEventListener('submit', function(e){
      e.preventDefault();
      var input = document.getElementById('convoInput');
      var text = input.value.trim();
      if(!text) return;
      LIFT.messages.send(activeKey, text);
      input.value = '';
      renderThreadList();
      renderConvo();
    });

    document.getElementById('voiceCallBtn').addEventListener('click', function(){ startCall(name, false); });
    document.getElementById('videoCallBtn').addEventListener('click', function(){ startCall(name, true); });

    pane.querySelectorAll('.bubble-menu-btn').forEach(function(btn){
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        var menu = pane.querySelector('.bubble-menu[data-id="' + btn.dataset.id + '"]');
        var wasOpen = menu.classList.contains('open');
        pane.querySelectorAll('.bubble-menu.open').forEach(function(m){ m.classList.remove('open'); });
        if(!wasOpen) menu.classList.add('open');
      });
    });
    pane.querySelectorAll('.bubble-edit-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var msg = history.find(function(m){ return m.id === btn.dataset.id; });
        if(!msg) return;
        var next = window.prompt('Edit your message', msg.text || '');
        if(next === null) return;
        next = next.trim();
        if(!next){ LIFT.toast('Message can\'t be empty'); return; }
        LIFT.messages.edit(msg.id, next);
        LIFT.toast('Message updated');
        renderThreadList();
        renderConvo();
      });
    });
    pane.querySelectorAll('.bubble-del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        if(!window.confirm('Delete this message?')) return;
        LIFT.messages.remove(btn.dataset.id);
        LIFT.toast('Message deleted');
        renderThreadList();
        renderConvo();
      });
    });
    document.addEventListener('click', function closeMenus(){
      pane.querySelectorAll('.bubble-menu.open').forEach(function(m){ m.classList.remove('open'); });
    }, { once: true });
  }

  /* ---- Simulated voice / video call ---- */
  var callTimer = null, callSeconds = 0, callInterval = null;

  function startCall(name, isVideo){
    var modal = document.getElementById('callModal');
    document.getElementById('callName').textContent = name;
    document.getElementById('callAvatar').textContent = initialOf(name);
    document.getElementById('callStatus').textContent = 'Calling…';
    document.getElementById('callVideoFrame').style.display = isVideo ? 'flex' : 'none';
    document.getElementById('callMuteBtn').classList.remove('active');
    modal.classList.add('open');
    callSeconds = 0;
    clearTimeout(callTimer); clearInterval(callInterval);

    callTimer = setTimeout(function(){
      document.getElementById('callStatus').textContent = '00:00';
      callInterval = setInterval(function(){
        callSeconds++;
        var mm = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        var ss = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('callStatus').textContent = mm + ':' + ss;
      }, 1000);
    }, 1800);
  }
  function endCall(){
    clearTimeout(callTimer); clearInterval(callInterval);
    document.getElementById('callModal').classList.remove('open');
  }
  document.getElementById('callEndBtn').addEventListener('click', endCall);
  document.getElementById('callClose').addEventListener('click', endCall);
  document.getElementById('callMuteBtn').addEventListener('click', function(){
    this.classList.toggle('active');
    LIFT.toast(this.classList.contains('active') ? 'Microphone muted' : 'Microphone unmuted');
  });

  document.addEventListener('click', function(e){
    var row = e.target.closest('.thread-row');
    if(!row) return;
    activeKey = row.dataset.key;
    var url = new URL(location.href);
    url.searchParams.set('to', activeKey);
    history.replaceState(null, '', url);
    renderThreadList();
    renderConvo();
  });

  if(renderShell()){
    renderThreadList();
    renderConvo();
  }
</script>

</body>
</html>
