<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('lift-theme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFT  Payment Methods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/lift-shop.css">
<link rel="stylesheet" href="../css/pay-provider.css">
<link rel="stylesheet" href="../css/payment.css">
</head>
<body class="lift-shell">

<div id="lift-header"></div>

<div class="lift-page">
  <a href="order-summary.html" class="lift-back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    Back to order summary
  </a>
  <div class="lift-crumb" style="text-align:center;">Step 2 of 3 · Payment</div>

  <div class="pay-hero">
    <h1 class="lift-page-title" style="text-decoration:none;">Choose a Payment Method</h1>
    <div class="amount-chip"><span>Amount to pay</span> · <span id="amountValue">0 FCFA</span></div>
  </div>

  <div class="method-grid" id="methodGrid">
    <button type="button" class="method-card mtn" data-method="mtn">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
      <div class="method-logo">my<br>MTN</div>
      <h3>MTN Mobile Money</h3>
      <p>Pay instantly from your MTN MoMo balance</p>
    </button>
    <button type="button" class="method-card orange" data-method="orange">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><polyline points="9 18 15 12 9 6"/></svg>
      <div class="method-logo">orange</div>
      <h3>Orange Money</h3>
      <p>Pay instantly from your Orange Money wallet</p>
    </button>
  </div>

  <div class="trust-row">
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Encrypted &amp; secure</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Instant confirmation</span>
  </div>
</div>

<div class="pay-modal-overlay" id="payModalOverlay">
  <div class="pay-modal" id="payModal">
    <button type="button" class="pay-modal-close" id="payModalClose">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Back
    </button>
    <div class="lift-crumb">Step 3 of 3 · Confirm payment</div>

    <div class="pay-card" id="payCard">
      <div class="pay-card-head">
        <div class="pay-logo" id="payLogo"></div>
        <h1 id="payTitle"></h1>
      </div>

      <div class="pay-amount-row">
        <span>Amount to pay</span>
        <strong id="payAmountValue">0 FCFA</strong>
      </div>

      <form id="payForm" novalidate>
        <label class="pay-label">Mobile Money Number</label>
        <div class="phone-row">
          <div class="flag-chip"><span class="flag-swatch"></span>+237</div>
          <input type="tel" id="phoneInput" inputmode="numeric" placeholder="6 70 13 44 56" maxlength="9" required>
        </div>
        <div class="field-error" id="phoneError"></div>

        <label class="pay-label" for="pinInput">Enter Pincode</label>
        <input type="password" id="pinInput" class="pin-input" placeholder="•••••" inputmode="numeric" maxlength="6" required>

        <label class="pay-label" for="pinConfirm">Confirm Pincode</label>
        <input type="password" id="pinConfirm" class="pin-input" placeholder="•••••" inputmode="numeric" maxlength="6" required>
        <div class="field-error" id="pinError"></div>

        <div class="pay-actions">
          <button type="button" class="lift-btn lift-btn-outline" id="payCancelBtn">Cancel Payment</button>
          <button type="submit" class="lift-btn pay-btn" id="payBtn">Pay Now</button>
        </div>
      </form>
    </div>

    <div class="pay-trust">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Your pincode is never stored — this is a secure simulated checkout.
    </div>
  </div>
</div>

<div id="lift-footer"></div>
<div class="lift-toast" id="lift-toast"></div>

<script src="../js/lift-shop.js"></script>
<script>
  LIFT.mountHeader('products');
  LIFT.mountFooter();

  var t = LIFT.cart.totals();
  if(!t.lines.length){
    LIFT.toast('Your cart is empty — add products before paying');
    setTimeout(function(){ window.location.href = 'cart.html'; }, 900);
  }
  document.getElementById('amountValue').textContent = LIFT.fcfa(t.total);

  var METHODS = {
    mtn:    { label: 'MTN Mobile Money',    brandClass: 'pay-mtn',    logo: 'my<br>MTN',
              titleHTML: 'Pay with <span class="brand-word">MTN</span> Mobile Money' },
    orange: { label: 'Orange Money',        brandClass: 'pay-orange', logo: 'orange',
              titleHTML: 'Pay with <span class="brand-word">Orange</span> Money' }
  };

  var overlay = document.getElementById('payModalOverlay');
  var payCard = document.getElementById('payCard');
  var payLogo = document.getElementById('payLogo');
  var payTitle = document.getElementById('payTitle');
  var payAmountValue = document.getElementById('payAmountValue');
  var form = document.getElementById('payForm');
  var phone = document.getElementById('phoneInput');
  var pin = document.getElementById('pinInput');
  var pinConfirm = document.getElementById('pinConfirm');
  var phoneError = document.getElementById('phoneError');
  var pinError = document.getElementById('pinError');
  var payBtn = document.getElementById('payBtn');
  var currentMethodKey = null;

  function openModal(key){
    var m = METHODS[key];
    if(!m) return;
    currentMethodKey = key;
    payCard.className = 'pay-card ' + m.brandClass;
    overlay.classList.remove('pay-mtn', 'pay-orange');
    overlay.classList.add(m.brandClass);
    payLogo.innerHTML = m.logo;
    payTitle.innerHTML = m.titleHTML;
    payAmountValue.textContent = LIFT.fcfa(LIFT.cart.totals().total);
    form.reset();
    phoneError.textContent = '';
    pinError.textContent = '';
    payBtn.disabled = false;
    payBtn.textContent = 'Pay Now';
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(function(){ phone.focus(); }, 150);
  }
  function closeModal(){
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('methodGrid').addEventListener('click', function(e){
    var card = e.target.closest('.method-card');
    if(card) openModal(card.dataset.method);
  });
  document.getElementById('payModalClose').addEventListener('click', closeModal);
  document.getElementById('payCancelBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
  });

  phone.addEventListener('input', function(){
    phone.value = phone.value.replace(/[^0-9]/g, '').slice(0, 9);
  });
  [pin, pinConfirm].forEach(function(el){
    el.addEventListener('input', function(){ el.value = el.value.replace(/[^0-9]/g, '').slice(0, 6); });
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    phoneError.textContent = '';
    pinError.textContent = '';
    var ok = true;

    if(phone.value.length < 9){
      phoneError.textContent = 'Enter a valid 9-digit mobile money number.';
      ok = false;
    }
    if(pin.value.length < 4){
      pinError.textContent = 'Pincode must be at least 4 digits.';
      ok = false;
    } else if(pin.value !== pinConfirm.value){
      pinError.textContent = "Pincodes don't match.";
      ok = false;
    }
    if(!ok) return;

    if(!LIFT.user.get()){
      LIFT.toast('Please log in to complete your order');
      setTimeout(function(){ window.location.href = LIFT.loginUrl('#login'); }, 900);
      return;
    }

    payBtn.disabled = true;
    payBtn.textContent = 'Processing…';

    setTimeout(function(){
      var order = LIFT.orders.create({
        method: METHODS[currentMethodKey].label,
        phone: '+237 ' + phone.value
      });
      window.location.href = 'order-success.html?order=' + encodeURIComponent(order.id);
    }, 1400);
  });
</script>

</body>
</html>
