<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('lift-theme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFT  Order Confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/lift-shop.css">
<style>
  .success-wrap{max-width:560px;margin:40px auto 0;text-align:center;}
  .success-badge{
    width:88px;height:88px;border-radius:50%;background:var(--lh-paper-soft);
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;
    animation:pop .5s cubic-bezier(.2,.9,.3,1.4);
  }
  .success-badge svg{width:42px;height:42px;color:var(--lh-green);}
  @keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}
  .success-wrap h1{font-size:1.9rem;font-weight:600;margin-bottom:10px;}
  .success-wrap p{color:var(--lh-text-soft);font-size:.95rem;margin-bottom:26px;}
  .order-id-chip{
    display:inline-block;background:var(--lh-ink);color:var(--lh-gold-pale);
    padding:10px 20px;border-radius:30px;font-weight:700;letter-spacing:1px;margin-bottom:30px;
    font-family:var(--lh-font-display);
  }
  .success-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body class="lift-shell">

<div id="lift-header"></div>

<div class="lift-page success-wrap">
  <div class="success-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1>Payment Successful</h1>
  <p id="successSub">Thank you your order has been placed and is now being processed.</p>
  <div class="order-id-chip" id="orderIdChip">LIFT-00000</div>
  <div class="success-actions">
    <a href="orders.html" class="lift-btn lift-btn-primary">View My Orders</a>
    <a href="products.html" class="lift-btn lift-btn-outline">Continue Shopping</a>
  </div>
</div>

<div id="lift-footer"></div>
<div class="lift-toast" id="lift-toast"></div>

<script src="../js/lift-shop.js"></script>
<script>
  LIFT.mountHeader('products');
  LIFT.mountFooter();

  var params = new URLSearchParams(location.search);
  var orderId = params.get('order');
  if(orderId){
    document.getElementById('orderIdChip').textContent = orderId;
  } else {
    document.getElementById('successSub').textContent = 'Your order history is available any time from My Orders.';
    document.getElementById('orderIdChip').style.display = 'none';
  }
</script>

</body>
</html>
